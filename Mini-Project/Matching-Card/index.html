<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Matching Card Game</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>

    <body>

        <div class="container">
            <div class="card">
                <div class="text">
                    <h2>Matching Card</h2>
                </div>
                <div class="button">
                    <button class="btns"><i class="fa-brands fa-figma"></i></button>
                    <button class="btns"><i class="fa-brands fa-github"></i></button>
                    <button class="btns"><i class="fa-brands fa-whatsapp"></i></button>
                    <button class="btns"><i class="fa-brands fa-instagram"></i></button>
                    <button class="btns"><i class="fa-brands fa-twitter"></i></button>
                    <button class="btns"><i class="fa-brands fa-linkedin"></i></button>
                    <button class="btns"><i class="fa-brands fa-youtube"></i></button>
                    <button class="btns"><i class="fa-brands fa-java"></i></button>
                    <button class="btns"><i class="fa-brands fa-python"></i></button>
                    <button class="btns"><i class="fa-brands fa-react"></i></button>
                    <button class="btns"><i class="fa-brands fa-git"></i></button>
                    <button class="btns"><i class="fa-brands fa-angular"></i></button>
                    <button class="btns">1</button>
                    <button class="btns">1</button>
                    <button class="btns">1</button>
                    <button class="btns">1</button>
                </div>
                <div class="time">
                    <span>Time: <time id="tme" datetime="1:30">1:30</time></span>
                </div>
                <div class="reset-btn">
                    <button id="play-btn">Play</button>
                    <button id="rst-btn">Restart</button>
                </div>
            </div>
        </div>
        <script src="script.js"></script>

    </body>

</html>
