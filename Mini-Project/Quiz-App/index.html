<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz App</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </head>

    <body>
    
        <div class="container">

            <div class="text-iteam">

                <div class="img">
                    <img src="image/Programming.svg" alt="image" height="400">
                </div>

                <h2>
                    <span>Build Quiz App With <br></span>
                    <span>HTML</span> ,
                    <span>CSS</span> And
                    <span>JAVASCRIPT</span>
                </h2>

            </div>

            <div class="box">

                <h2>Simple Quiz</h2>

                <div class="question-para">
                    <p>1. What is very small indian city ?</p>

                </div>

                <div class="btns">
                    <button class="btn">Option A</button>
                    <button class="btn">Option B</button>
                    <button class="btn">Option C</button>
                    <button class="btn">Option D</button>
                </div>

                <div class="btn-next">
                    <button id="next">Next</button>
                </div>
                
            </div>

        </div>

        <script src="script.js"></script>
    </body>

</html>
